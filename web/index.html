  <script>
    // keep your helper if you need it
    function openLink(url, target, isAsync = false) {
      const is_safari = /^(?!.*chrome).*safari/i.test(
        navigator.userAgent.toLowerCase()
      );
      if (is_safari && isAsync) window.location.href = url;
      else window.open(url, target);
    }
  </script>
